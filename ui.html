<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FairFlow AI · 여정 점검</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Malgun Gothic", system-ui, sans-serif;
      color: #1c3029;
      background: #f8f9f6;
      font-size: 13px;
      line-height: 1.55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; }
    h1, h2, h3, p { margin: 0; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .55; }
    :focus-visible { outline: 3px solid #377ab6; outline-offset: 3px; }
    button, summary { -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    .masthead {
      display: flex; flex: none; align-items: center; justify-content: space-between; gap: 10px;
      border-bottom: 1px solid #d6e0d8; background: #fff; padding: 12px 18px;
    }
    .brand { display: inline-flex; align-items: center; gap: 9px; font-size: 18px; font-weight: 750; letter-spacing: -.6px; }
    .mark {
      position: relative; width: 26px; height: 26px; border-radius: 7px; background: #214e3f;
    }
    .mark::before, .mark::after {
      content: ""; position: absolute; height: 4px; background: #cbee9c;
      transform: skewY(-25deg); border-radius: 1px;
    }
    .mark::before { left: 6px; top: 7px; width: 14px; }
    .mark::after { left: 6px; top: 14px; width: 9px; }
    .scan-tools { display: grid; justify-items: end; gap: 3px; min-width: 0; }
    .selection-info {
      max-width: min(220px, 42vw); overflow: hidden; color: #446553; font-size: 11px;
      text-align: right; text-overflow: ellipsis; white-space: nowrap;
    }
    main { flex: 1; overflow: auto; min-height: 0; padding: 18px; scrollbar-gutter: stable; }
    .summary {
      padding: 0 0 14px; border-bottom: 1px solid #dce6dc;
    }
    .summary-line { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .summary-line > div { min-width: 0; }
    .risk-count {
      background: #e9f1e9; color: #2c533d; font-size: 12px; font-weight: 750;
      border-radius: 5px; padding: 4px 8px; white-space: nowrap;
    }
    .risk-count[data-risk="true"] { background: #fbe8df; color: #8d351f; }
    .eyebrow, .mini-heading { color: #46634e; font-size: 11px; font-weight: 700; }
    h1 { font-size: 21px; letter-spacing: -.7px; line-height: 1.35; overflow-wrap: anywhere; }
    .summary h1 { margin: 3px 0 0; }
    .confirm-start { margin-top: 11px; border-top: 1px solid #ccd9cb; padding-top: 9px; color: #43594a; font-size: 12px; }
    .confirm-start button {
      margin-top: 6px; border: 1px solid #a2b5a4; border-radius: 5px; padding: 5px 8px;
      color: #2e523a; background: #fff; font-weight: 650;
    }
    .confirm-start button:hover { border-color: #74947d; }
    .shipping, .proposal { margin-top: 12px; padding: 13px; border: 1px solid #cad7c9; border-radius: 9px; background: #fff; }
    .shipping h2, .proposal h2 { margin: 3px 0 5px; font-size: 15px; letter-spacing: -.35px; }
    .shipping-intro, .shipping-message { color: #45594b; font-size: 12px; }
    .shipping-message[role="alert"] { margin-top: 6px; color: #8d351f; }
    .shipping-action { margin-top: 9px; border-radius: 5px; padding: 6px 10px; font-weight: 650; }
    .shipping-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .shipping-options { display: flex; flex-wrap: wrap; gap: 4px; margin: 9px 0; padding: 0; border: 0; min-width: 0; }
    .shipping-options legend { padding: 0 0 4px; color: #475c4d; font-size: 11px; font-weight: 700; }
    .shipping-choice { position: relative; cursor: pointer; }
    .shipping-choice input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .shipping-choice span { display: block; padding: 4px 7px; border: 1px solid #d0dbd1; border-radius: 4px; color: #385040; font-size: 12px; }
    .shipping-choice input:checked + span { background: #23503c; border-color: #23503c; color: #fff; }
    .shipping-choice input:focus-visible + span { outline: 3px solid #377ab6; outline-offset: 2px; }
    .shipping-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; border-top: 1px solid #e0e7de; padding: 8px 0; }
    .shipping-row-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .shipping-link { padding: 0; border: 0; background: transparent; color: #26573e; font: inherit; text-align: left; text-underline-offset: 3px; text-decoration: underline; }
    .shipping-row-title .shipping-link { font-weight: 700; }
    .shipping-link:disabled { color: #627067; cursor: default; }
    .shipping-status, .shipping-default, .shipping-fee { color: #4d5e50; font-size: 11px; }
    .shipping-row[data-status="risk_signal"] .shipping-status { color: #8d351f; }
    .shipping-row[data-status="needs_context"] .shipping-status { color: #77571c; }
    .shipping-amount { text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; }
    .shipping-fee { text-align: right; }
    .shipping-row > .shipping-link { justify-self: end; grid-column: 2; font-size: 11px; }
    .preview { margin: 12px 0 10px; padding: 10px; border: 1px solid #cddccc; border-radius: 8px; background: #f9faf7; scroll-margin-top: 8px; }
    .preview-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .preview-heading h3 { font-size: 14px; }
    .preview-switch { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .preview-switch button, .preview-tools button, .preview-routes button {
      padding: 4px 7px; border: 1px solid #b9c9bc; border-radius: 5px; color: #254b38; background: #fff; font-size: 11px; font-weight: 650;
    }
    .preview-switch button[aria-pressed="true"], .preview-tools button[aria-pressed="true"] { color: #fff; background: #28563f; border-color: #28563f; }
    .preview-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 8px; margin: 8px 0 0; color: #405548; font-size: 11px; }
    .preview-tools input { flex: 1; min-width: 58px; accent-color: #28563f; }
    .preview-stage {
      display: flex; justify-content: center; align-items: center; padding: 9px; margin: 8px 0;
      border: 1px solid #dce5db; border-radius: 6px; background: #ecf1eb;
    }
    .preview-canvas { position: relative; width: 100%; background: #fff; overflow: hidden; box-shadow: 0 1px 6px #16372420; }
    .preview-plane, .preview-plane img, .preview-markers { position: absolute; left: 0; top: 0; }
    .preview-plane img, .preview-markers { width: 100%; height: 100%; }
    .preview-plane img { object-fit: fill; }
    .preview-markers { pointer-events: none; }
    .preview-marker, .preview-hotspot { position: absolute; padding: 0; border: 2px solid #28694b; border-radius: 4px; background: #c3f1c322; pointer-events: auto; }
    .preview-marker:hover, .preview-hotspot:hover { background: #b5f4b844; }
    .preview-marker:focus-visible, .preview-hotspot:focus-visible { outline-offset: -2px; }
    .preview-before { position: absolute; border: 1.5px dashed #9c4d32; border-radius: 4px; pointer-events: none; }
    .preview-hotspot { border-style: dotted; border-color: #28563f9e; background: transparent; }
    .preview-list { display: grid; gap: 4px; margin-top: 6px; }
    .preview-list button { width: 100%; }
    .preview-list .proposal-step-detail { font-weight: 400; }
    .preview-routes { display: flex; gap: 4px; flex-wrap: wrap; }
    .preview-routes button:hover, .preview-tools button:not([aria-pressed="true"]):hover { background: #eaf1e8; }
    .preview-order { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 7px 0; }
    .preview-order p { color: #405548; font-size: 11px; }
    .preview-order strong { font-size: 17px; font-variant-numeric: tabular-nums; }
    .preview-adopted { margin-top: 7px; color: #2b583d; font-size: 11px; overflow-wrap: anywhere; }
    .proposal-row { padding: 9px 0; border-top: 1px solid #e0e7de; }
    .proposal-row:first-of-type { margin-top: 9px; }
    .proposal-row-title { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 13px; }
    .proposal-status {
      border-radius: 4px; padding: 1px 5px; background: #e5efe6; color: #386348; font-size: 11px; font-weight: 700;
    }
    .proposal-row[data-status="risk_signal"] .proposal-status { background: #fae9df; color: #8d351f; }
    .proposal-row[data-status="needs_context"] .proposal-status { background: #f5edcf; color: #705016; }
    .proposal-summary { margin-top: 5px; color: #405548; font-size: 12px; }
    .proposal-steps { margin: 5px 0 0; padding: 0; list-style: none; }
    .proposal-steps li + li { margin-top: 4px; }
    .proposal-step {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1px 8px;
      width: 100%; padding: 6px 8px; border: 1px solid #dfe8de; border-radius: 5px; background: #f6f8f3;
      color: #294d3a; text-align: left; overflow-wrap: anywhere;
    }
    .proposal-step:not(:disabled):hover { background: #edf3e9; border-color: #a2b9a4; }
    .proposal-step span { grid-column: 1; }
    .proposal-step::after { content: "↗"; grid-column: 2; grid-row: 1 / 3; font-size: 13px; }
    .proposal-step:disabled::after { content: none; }
    .proposal-step-label { font-size: 12px; font-weight: 700; }
    .proposal-step-detail { font-size: 11px; color: #4d5e50; }
    .finding {
      margin-bottom: 8px; border: 1px solid #d4dcd5; border-radius: 9px; background: #fff;
      --status-ink: #386348; --status-bg: #e5efe6;
    }
    .findings { margin-top: 14px; }
    .finding[data-status="risk_signal"] { border-color: #dfd3cc; --status-ink: #8d351f; --status-bg: #fae9df; }
    .finding[data-status="needs_context"] { --status-ink: #705016; --status-bg: #f5edcf; }
    summary { cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    .finding > summary {
      display: grid; grid-template-columns: minmax(0, 1fr) auto 7px;
      align-items: center; gap: 8px; padding: 12px;
    }
    .finding > summary::after, .warnings summary::after, .advanced-tools > summary::after, .other-findings > summary::after {
      content: ""; width: 6px; height: 6px; border-right: 1.5px solid #708174;
      border-bottom: 1.5px solid #708174; transform: rotate(45deg);
    }
    .finding[open] > summary::after, .warnings[open] summary::after,
    .advanced-tools[open] > summary::after, .other-findings[open] > summary::after { transform: rotate(225deg); }
    .pattern { font-size: 14px; font-weight: 730; letter-spacing: -.35px; overflow-wrap: anywhere; }
    .badge { color: var(--status-ink); background: var(--status-bg); padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; }
    .finding-body { padding: 0 12px 13px; overflow-wrap: anywhere; }
    .reason, .suggestion { color: #435349; font-size: 12px; }
    .finding-body > .suggestion { margin-top: 8px; }
    .review-title { font-size: 17px; line-height: 1.4; letter-spacing: -.4px; }
    .review-title + .reason, .review-alternative h4 + p { margin-top: 4px; }
    .review-rule {
      margin-top: 11px; padding: 8px 10px; border-radius: 5px;
      border-left: 3px solid #87948a; background: #f1f4f1; color: #334e40; font-size: 12px;
    }
    .review-rule header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; }
    .review-citation { font-weight: 750; }
    .review-rule p { margin-top: 4px; }
    .review-rule p + p { color: #45584d; margin-top: 3px; }
    .review-solutions { margin-top: 13px; }
    .review-solutions > h3 { margin-bottom: 6px; font-size: 13px; }
    .review-grid, .design-thumbnails { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .review-grid.single { grid-template-columns: minmax(0, 1fr); }
    .review-alternative { border: 1px solid #dce6dd; padding: 8px; border-radius: 6px; min-width: 0; }
    .review-alternative h4 { margin: 0; font-size: 12px; line-height: 1.45; }
    .review-alternative p { color: #435349; font-size: 11px; line-height: 1.5; }
    .review-sketch { display: grid; gap: 4px; margin-bottom: 6px; color: #284c3a; font-size: 11px; }
    .review-sketch.checked, .review-sketch.buttons { background: #eff5ee; padding: 6px; border-radius: 4px; }
    .sketch-option { display: flex; align-items: center; gap: 5px; white-space: normal; overflow-wrap: anywhere; }
    .sketch-option::before { content: ""; flex: 0 0 9px; height: 9px; border: 1px solid #698171; background: #fff; border-radius: 2px; }
    .sketch-option.default::before { background: #355944; }
    .sketch-button { border: 1px solid #a7bcae; padding: 2px 5px; border-radius: 3px; font-weight: 650; }
    .review-sketch.price { background: #eff5ee; padding: 5px 6px; border-radius: 4px; }
    .review-sketch.price strong { font-size: 14px; font-variant-numeric: tabular-nums; }
    .copy-diff { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 6px 0; }
    .copy-value { min-width: 0; padding: 6px 8px; border-radius: 4px; background: #f6f1ee; }
    .copy-value:last-child { background: #edf5eb; }
    .copy-value strong { display: block; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
    .review-cta { margin-top: 8px; border-radius: 5px; padding: 5px 8px; font-size: 11px; font-weight: 650; }
    .design-thumbnails { margin: 7px 0; }
    .design-thumb {
      display: flex; flex-direction: column; align-items: center; min-width: 0;
      padding: 6px; gap: 4px; border: 1px solid #dce5db; border-radius: 5px;
      color: #264f39; background: #f7f9f5; font-size: 11px; font-weight: 650;
    }
    .design-thumb img { display: block; width: 100%; height: 160px; object-fit: contain; }
    .evidence { margin-top: 9px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .evidence .mini-heading { color: #53665a; margin-right: 2px; }
    .layer {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 4px 7px;
      border: 1px solid #ced8cf; border-radius: 4px; color: #284c3a; background: #fff; font-size: 12px;
    }
    .layer:hover { background: #edf3e9; border-color: #87a58c; }
    .layer::before { content: ""; flex: none; width: 7px; height: 7px; border: 1px solid currentColor; transform: rotate(45deg); }
    .layer-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .advanced-tools, .other-findings {
      margin-top: 10px; padding: 0 11px; border: 1px solid #d4dfd4; border-radius: 7px; background: #fff;
    }
    .advanced-tools > summary, .other-findings > summary {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 0; color: #2c4c3a; font-size: 12px; font-weight: 700;
    }
    .advanced-tools[open], .other-findings[open] { padding-bottom: 3px; }
    .advanced-tools .shipping, .advanced-tools .proposal { margin: 0 0 8px; }
    .empty-result { padding: 12px 0 3px; color: #435349; }
    .warnings { margin-top: 12px; color: #695228; font-size: 12px; }
    .warnings summary { display: flex; align-items: center; gap: 7px; font-weight: 700; }
    .warnings ul { margin: 6px 0 0; padding-left: 18px; }
    .warnings li { overflow-wrap: anywhere; }
    .message { display: flex; align-items: flex-start; gap: 12px; margin: 6px 0; padding: 16px; border: 1px solid #d5ded3; border-radius: 8px; background: #fff; }
    .message h1 { margin: 0 0 5px; font-size: 18px; }
    .message p { color: #475a4c; }
    .frame-icon { border: 1.5px dashed #779381; border-radius: 5px; flex: 0 0 29px; height: 24px; margin-top: 2px; background: #eef4ed; }
    .actions { display: flex; gap: 5px; }
    .actions button { min-height: 34px; border-radius: 6px; padding: 4px 9px; font-size: 12px; font-weight: 700; }
    .primary { color: #fff; border: 1px solid #234c39; background: #28563f; }
    .primary:hover { background: #1d4632; }
    .secondary { color: #294d3a; background: #fff; border: 1px solid #b9c9bc; }
    .secondary:hover { background: #f1f5ee; }
    #notice:empty { display: none; }
    #notice:not(:empty) { flex: none; margin: 0; padding: 6px 18px; color: #365442; background: #edf3e9; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 360px) {
      main, .masthead { padding-left: 10px; padding-right: 10px; }
      .brand { font-size: 15px; gap: 6px; }
      .review-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="mark" aria-hidden="true"></span>FairFlow</div>
    <div class="scan-tools">
      <p id="selection-info" class="selection-info" hidden></p>
      <div class="actions">
        <button id="scan-selection" class="primary" type="button">검사</button>
        <button id="scan" class="primary" type="button" hidden>다시 검사</button>
      </div>
    </div>
  </header>
  <p id="notice" role="status"></p>
  <main id="content" aria-label="여정 점검 결과"></main>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <script>
    const content = document.getElementById('content');
    const notice = document.getElementById('notice');
    const announcement = document.getElementById('announcement');
    const scan = document.getElementById('scan');
    const scanSelection = document.getElementById('scan-selection');
    const selectionInfo = document.getElementById('selection-info');
    const patternNames = {
      paid_option_preselection: '특정옵션 사전선택',
      misleading_visual_hierarchy: '잘못된 계층구조',
      drip_pricing: '순차공개 가격책정'
    };
    const statuses = {
      risk_signal: { label: '위험 신호', order: 0 },
      needs_context: { label: '정보 부족', order: 1 },
      signal_absent: { label: '신호 없음', order: 2 }
    };
    const variantNames = { original: '원본', minimal: '최소 수정', layout: '배치 변경' };
    const choiceNames = { default: '선택 없이 진행', basic: '일반배송 선택', fast: '빠른배송 선택' };
    const proposalKinds = {
      hierarchy: {
        title: '선택 버튼 수정안', comparison: '버튼별 이동 경로', create: '계층구조 수정안 만들기',
        empty: '이동 경로를 확인할 수 없습니다.'
      },
      price: {
        title: '가격 표시 수정안', comparison: '필수 비용 표시 시점', create: '가격 수정안 만들기',
        empty: '비용 표시 단계를 확인할 수 없습니다.'
      }
    };
    const won = new Intl.NumberFormat('ko-KR');
    let shippingHost = null;
    let proposalHost = null;
    let advancedTools = null;
    let advancedOpen = false;
    let inspectedRoot = null;
    let selected = null;
    let selectionKnown = false;
    let rescanAvailable = false;
    let controlsBusy = false;
    const proposalStates = new Map();
    let shippingOffer = null;
    let comparison = null;
    let shippingChoice = 'default';
    let shippingBusy = false;
    let shippingError = '';
    const adoptedShipping = new Map();
    const newShippingPreview = () => ({
      open: false, busy: false, action: '', error: '', data: null,
      key: 'minimal', mode: 'overlay', route: null, opacity: 100, peek: false
    });
    let shippingPreview = newShippingPreview();

    function send(message) {
      parent.postMessage({ pluginMessage: message }, '*');
    }

    function getPluginMessage(event) {
      // Figma relays messages through its sandbox. The origin window can differ
      // from the panel's immediate parent.
      const message = event.data?.pluginMessage;
      return message && typeof message === 'object' && typeof message.type === 'string' ? message : null;
    }

    function element(tag, className, text) {
      const item = document.createElement(tag);
      if (className) item.className = className;
      if (text) item.textContent = text;
      return item;
    }

    function showControls(canRescan, busy) {
      rescanAvailable = canRescan;
      controlsBusy = busy;
      const anotherFrame = selected && selected.id !== inspectedRoot;
      scan.hidden = !canRescan;
      scan.disabled = busy;
      scan.className = anotherFrame ? 'secondary' : 'primary';
      scanSelection.hidden = canRescan && selectionKnown && !anotherFrame;
      scanSelection.disabled = busy || (selectionKnown && !selected);
      scanSelection.textContent = busy && !canRescan ? '검사 중…' : canRescan ? '선택 검사' : '검사';
      scanSelection.className = canRescan && !anotherFrame ? 'secondary' : 'primary';
      selectionInfo.hidden = !canRescan || !anotherFrame || busy;
      selectionInfo.textContent = anotherFrame ? '선택됨 · ' + selected.name : '';
      selectionInfo.title = anotherFrame ? selected.name : '';
    }

    function showMessage(title, body, loading = false) {
      shippingHost = null;
      proposalHost = null;
      advancedTools = null;
      const section = element('section', 'message');
      const frame = element('span', 'frame-icon');
      frame.setAttribute('aria-hidden', 'true');
      const copy = element('div');
      copy.append(element('h1', '', title), element('p', '', body));
      section.append(frame, copy);
      content.replaceChildren(section);
      content.setAttribute('aria-busy', String(loading));
      announcement.textContent = title;
      notice.textContent = '';
      showControls(false, loading);
    }

    function showSelection() {
      if (selected) showMessage(selected.name, '검사를 누르면 이 프레임과 연결된 화면을 확인합니다.');
      else showMessage('프레임을 선택하세요', 'Figma 캔버스에서 검사할 프레임 1개를 선택합니다.');
    }

    function money(value) {
      return Number.isSafeInteger(value) && value >= 0 ? won.format(value) + '원' : '확인 필요';
    }

    function panelButton(label, className, onClick) {
      const button = element('button', className, label);
      button.type = 'button';
      button.addEventListener('click', onClick);
      return button;
    }

    function requestShipping(type, button) {
      if (comparisonBusy()) return;
      shippingPreview = newShippingPreview();
      shippingBusy = true;
      shippingError = '';
      button.disabled = true;
      showControls(true, true);
      send({ type });
    }

    function comparisonBusy() {
      return shippingBusy || shippingPreview.busy || [...proposalStates.values()].some(state => state.busy);
    }

    function shippingColumn(column) {
      const row = element('article', 'shipping-row');
      row.dataset.shippingKey = column.key;
      row.dataset.status = column.status || 'unscanned';
      const title = element('div', 'shipping-row-title');
      const name = variantNames[column.key];
      const frame = panelButton(name, 'shipping-link', () => send({ type: 'shipping-focus', key: column.key }));
      frame.dataset.shippingFocus = 'frame';
      frame.disabled = comparisonBusy();
      frame.setAttribute('aria-label', name + ' 배송 화면 보기');
      title.append(frame, element('span', 'shipping-status', statuses[column.status]?.label || '미검사'));
      const total = element('strong', 'shipping-amount');
      const fee = element('span', 'shipping-fee');
      const defaultName = { fast: '빠른배송', basic: '일반배송' }[column.defaultOption] || '확인 필요';
      let option;
      const receipt = panelButton('주문 화면 보기', 'shipping-link', () => {
        if (option) send({ type: 'shipping-focus', key: column.key, option });
      });
      receipt.dataset.shippingFocus = 'receipt';
      receipt.setAttribute('aria-label', name + ' 주문 화면 보기');
      row.append(title, total, element('span', 'shipping-default', '기본값 ' + defaultName), fee, receipt);
      function update() {
        option = shippingChoice === 'default' ? column.defaultOption : shippingChoice;
        const knownOption = option === 'fast' || option === 'basic';
        const read = suffix => {
          if (!knownOption) return null;
          const key = option + suffix;
          return Object.hasOwn(column, key) ? column[key] : comparison[key];
        };
        total.textContent = money(read('Total'));
        fee.textContent = '배송비 ' + money(read('Fee'));
        receipt.disabled = comparisonBusy() || !knownOption;
      }
      update();
      return { row, update };
    }

    function renderShipping() {
      if (!shippingHost) return;
      shippingHost.replaceChildren();
      shippingHost.hidden = !(shippingOffer || comparison || shippingError);
      if (shippingHost.hidden) return;
      shippingHost.append(element('h2', '', comparison ? '배송안별 주문 총액' : '배송 옵션 수정안'));
      if (comparison) {
        const thumbnails = designThumbnails(comparison.thumbnails, key => send({ type: 'shipping-focus', key }));
        if (thumbnails) shippingHost.append(thumbnails);
        const columns = comparison.columns.filter(column => Object.hasOwn(variantNames, column.key)).map(shippingColumn);
        const options = element('fieldset', 'shipping-options');
        options.append(element('legend', '', '배송 선택 조건'));
        for (const [key, label] of Object.entries(choiceNames)) {
          const choice = element('label', 'shipping-choice');
          const input = element('input');
          input.type = 'radio';
          input.name = 'shipping-choice';
          input.value = key;
          input.dataset.shippingOption = key;
          input.checked = shippingChoice === key;
          input.addEventListener('change', () => {
            if (!input.checked) return;
            shippingChoice = key;
            columns.forEach(column => column.update());
            announcement.textContent = label + ' 기준으로 주문 총액을 표시합니다.';
          });
          choice.append(input, element('span', '', label));
          options.append(choice);
        }
        shippingHost.append(options, ...columns.map(column => column.row));
        const rescan = panelButton('수정안 재검사', 'shipping-action secondary', () => requestShipping('shipping-rescan', rescan));
        rescan.id = 'shipping-rescan';
        rescan.disabled = comparisonBusy() || !comparison.canRescan;
        const overview = panelButton('캔버스에서 나란히 보기', 'shipping-action secondary', () => send({ type: 'shipping-overview' }));
        overview.id = 'shipping-overview';
        overview.disabled = comparisonBusy();
        overview.title = '생성 시점의 원본 사본과 두 수정안 보기';
        const preview = panelButton('겹쳐보기', 'shipping-action primary', openShippingPreview);
        preview.id = 'shipping-preview';
        preview.disabled = comparisonBusy();
        preview.setAttribute('aria-expanded', String(shippingPreview.open));
        const actions = element('div', 'shipping-actions');
        actions.append(preview, overview, rescan);
        shippingHost.append(actions);
        if (shippingPreview.open) shippingHost.append(shippingPreviewPanel());
      } else if (shippingOffer) {
        const create = panelButton('배송 수정안 만들기', 'shipping-action primary', () => requestShipping('shipping-create', create));
        create.id = 'shipping-create';
        create.disabled = comparisonBusy();
        shippingHost.append(create);
      }
      if (shippingBusy || shippingError) {
        const status = element('p', 'shipping-message', shippingError || (comparison ? '수정안을 다시 검사하고 있습니다.' : '배송 수정안을 만들고 있습니다.'));
        status.setAttribute('role', shippingError ? 'alert' : 'status');
        shippingHost.append(status);
      }
    }

    function resetComparisons() {
      inspectedRoot = null;
      advancedOpen = false;
      proposalStates.clear();
      shippingOffer = null;
      comparison = null;
      shippingChoice = 'default';
      shippingBusy = false;
      shippingError = '';
      shippingPreview = newShippingPreview();
      adoptedShipping.clear();
    }

    function shippingReply(message) {
      const replyRoot = message.rootId || message.comparison?.rootId;
      if (!inspectedRoot || (replyRoot && replyRoot !== inspectedRoot)) return;
      shippingBusy = message.type === 'shipping-loading';
      shippingError = message.type === 'shipping-error' ? message.message || '배송 수정안을 열 수 없습니다.' : '';
      if (message.type === 'shipping-comparison') {
        comparison = { ...message.comparison, canRescan: message.canRescan ?? message.comparison.canRescan };
        announcement.textContent = '배송안별 주문 총액을 표시했습니다.';
      }
      renderComparisons();
    }

    function openShippingPreview() {
      if (comparisonBusy()) return;
      const key = shippingPreview.key;
      shippingPreview = { ...newShippingPreview(), key, open: true, busy: true, action: 'preview' };
      renderComparisons();
      shippingHost.querySelector('#shipping-preview-panel')?.scrollIntoView?.({ block: 'start' });
      send({ type: 'shipping-preview' });
    }

    function previewButton(label, id, onClick, className = 'secondary') {
      const button = panelButton(label, className, onClick);
      if (id) button.id = id;
      button.disabled = comparisonBusy();
      return button;
    }

    function previewRect(node, bounds) {
      if (!bounds) return false;
      const { x, y, width, height } = bounds;
      if (![x, y, width, height].every(Number.isFinite)) return false;
      const left = Math.max(0, x), top = Math.max(0, y);
      const right = Math.min(1, x + width), bottom = Math.min(1, y + height);
      if (right <= left || bottom <= top) return false;
      Object.assign(node.style, {
        left: left * 100 + '%', top: top * 100 + '%',
        width: (right - left) * 100 + '%', height: (bottom - top) * 100 + '%'
      });
      return true;
    }

    function previewPlane(canvas, frame, width, height, key, label) {
      const plane = element('div', 'preview-plane');
      plane.style.width = frame.width / width * 100 + '%';
      plane.style.height = frame.height / height * 100 + '%';
      if (typeof frame.png === 'string' && frame.png.length <= 8000000 && /^[A-Za-z0-9+/]+={0,2}$/.test(frame.png)) {
        const image = element('img');
        image.dataset.previewImage = key;
        image.src = 'data:image/png;base64,' + frame.png;
        image.alt = label;
        plane.append(image);
      }
      canvas.append(plane);
      return plane;
    }

    function previewOverlayVisibility(panel) {
      const { opacity, peek } = shippingPreview;
      const image = panel.querySelector('[data-preview-image="proposal"]');
      if (image) {
        image.style.opacity = String(peek ? 0 : opacity / 100);
        image.setAttribute('aria-hidden', String(peek || opacity === 0));
      }
      for (const layer of panel.querySelectorAll('.preview-markers')) layer.hidden = peek || opacity === 0;
      const button = panel.querySelector('#shipping-preview-peek');
      if (button) {
        button.setAttribute('aria-pressed', String(peek));
        button.textContent = peek ? '수정안 다시 보기' : '원본 잠깐 보기';
      }
    }

    function redrawShippingPreview(selector) {
      const panel = shippingHost?.querySelector('#shipping-preview-panel');
      if (!panel) return;
      const next = shippingPreviewPanel();
      panel.replaceWith(next);
      next.querySelector(selector)?.focus({ preventScroll: true });
    }

    function focusPreviewMarker(column, marker) {
      send({ type: 'shipping-preview-focus', key: column.key, marker: marker.key });
    }

    function routePreview(column, route) {
      const option = route === 'continue' ? column.defaultOption : route;
      if (!column.receipts?.[option]) return;
      shippingPreview.route = route;
      redrawShippingPreview('#shipping-preview-back');
      announcement.textContent = '주문 합계 ' + money(column[option + 'Total']);
    }

    function previewCanvas(column, original, receipt, openRoute) {
      const overlay = shippingPreview.mode === 'overlay';
      const current = receipt || column.frame;
      const layered = overlay && column.key !== 'original' && original?.frame;
      const width = Math.max(current.width, layered ? original.frame.width : 0);
      const height = Math.max(current.height, layered ? original.frame.height : 0);
      const stage = element('div', 'preview-stage');
      if (!(width > 0) || !(height > 0)) {
        stage.append(element('p', 'shipping-intro', '화면 크기를 읽을 수 없습니다.'));
        return stage;
      }
      const canvas = element('div', 'preview-canvas');
      canvas.style.aspectRatio = width + ' / ' + height;
      canvas.style.maxWidth = Math.min(305, 330 * width / height) + 'px';
      stage.append(canvas);
      if (layered) {
        const backdrop = previewPlane(canvas, original.frame, width, height, 'original', '원본 배송 화면');
        const proposal = previewPlane(canvas, column.frame, width, height, 'proposal', variantNames[column.key] + ' 배송 화면');
        const before = element('div', 'preview-markers');
        const after = element('div', 'preview-markers');
        for (const marker of column.markers || []) {
          const previous = element('span', 'preview-before');
          if (previewRect(previous, marker.from)) before.append(previous);
          const target = previewButton('', null, () => focusPreviewMarker(column, marker), 'preview-marker');
          target.title = marker.label + ' 레이어로 이동';
          target.setAttribute('aria-label', target.title);
          target.dataset.previewMarker = marker.key;
          if (previewRect(target, marker)) after.append(target);
        }
        // Keep old and new marks above both raster layers.
        const locate = (marks, plane) => {
          marks.style.width = plane.style.width;
          marks.style.height = plane.style.height;
          canvas.append(marks);
        };
        locate(before, backdrop);
        locate(after, proposal);
        return stage;
      }
      const layer = previewPlane(canvas, current, width, height, receipt ? 'receipt' : column.key, receipt ? '주문 확인 화면' : variantNames[column.key] + ' 배송 화면');
      if (!overlay && !receipt) {
        for (const hotspot of column.hotspots || []) {
          const target = previewButton('', null, () => openRoute(hotspot.key), 'preview-hotspot');
          target.dataset.previewRoute = hotspot.key;
          target.title = hotspot.label;
          target.setAttribute('aria-label', hotspot.label);
          if (previewRect(target, hotspot)) layer.append(target);
        }
      }
      return stage;
    }

    function shippingPreviewPanel() {
      const panel = element('section', 'preview');
      panel.id = 'shipping-preview-panel';
      panel.setAttribute('aria-label', '배송 화면 미리보기');
      panel.setAttribute('aria-busy', String(shippingPreview.busy));
      const heading = element('div', 'preview-heading');
      const close = previewButton('미리보기 닫기', 'shipping-preview-close', () => {
        shippingPreview.open = false;
        renderComparisons();
        shippingHost.querySelector('#shipping-preview')?.focus();
      }, 'shipping-link');
      heading.append(element('h3', '', '배송 화면 미리보기'), close);
      panel.append(heading);
      const { data, mode, route } = shippingPreview;
      if (shippingPreview.busy || shippingPreview.error) {
        const message = element('p', 'shipping-message', shippingPreview.error ||
          (shippingPreview.action === 'adopt' ? '채택한 안을 Figma에 만들고 있습니다.' : 'Figma 화면을 불러오고 있습니다.'));
        message.setAttribute('role', shippingPreview.error ? 'alert' : 'status');
        panel.append(message);
      }
      const columns = (data?.columns || []).filter(item => Object.hasOwn(variantNames, item.key) && item.frame);
      const original = columns.find(item => item.key === 'original');
      const column = columns.find(item => item.key === shippingPreview.key) || original;
      if (!column) return panel;

      const keys = element('div', 'preview-switch');
      keys.setAttribute('aria-label', '배송안 선택');
      keys.setAttribute('role', 'group');
      for (const item of columns) {
        const button = previewButton(variantNames[item.key], null, () => {
          Object.assign(shippingPreview, { key: item.key, route: null, peek: false, error: '' });
          redrawShippingPreview('[data-preview-column="' + item.key + '"]');
        });
        button.dataset.previewColumn = item.key;
        button.setAttribute('aria-pressed', String(item.key === column.key));
        keys.append(button);
      }
      const modes = element('div', 'preview-switch');
      modes.setAttribute('aria-label', '미리보기 방식');
      modes.setAttribute('role', 'group');
      for (const [key, label] of [['overlay', '겹쳐보기'], ['test', '직접 눌러보기']]) {
        const id = 'shipping-preview-' + key;
        const button = previewButton(label, id, () => {
          Object.assign(shippingPreview, { mode: key, route: null, peek: false, error: '' });
          redrawShippingPreview('#' + id);
        });
        button.setAttribute('aria-pressed', String(mode === key));
        modes.append(button);
      }
      panel.append(keys, modes);

      if (mode === 'overlay' && column.key !== 'original') {
        const tools = element('div', 'preview-tools');
        const label = element('label', '', '수정안 표시 강도');
        const input = element('input');
        input.id = 'shipping-preview-opacity';
        input.type = 'range';
        input.min = '0';
        input.max = '100';
        input.value = String(shippingPreview.opacity);
        input.disabled = comparisonBusy();
        label.htmlFor = input.id;
        const output = element('output', '', shippingPreview.opacity + '%');
        output.htmlFor = input.id;
        const handleOpacity = () => {
          Object.assign(shippingPreview, { opacity: Number(input.value), peek: false });
          output.textContent = input.value + '%';
          previewOverlayVisibility(panel);
        };
        input.addEventListener('input', handleOpacity);
        input.addEventListener('change', handleOpacity);
        const peek = previewButton('원본 잠깐 보기', 'shipping-preview-peek', () => {
          shippingPreview.peek = !shippingPreview.peek;
          previewOverlayVisibility(panel);
        });
        tools.append(label, input, output, peek);
        panel.append(tools);
      }
      const option = route === 'continue' ? column.defaultOption : route;
      const receipt = mode === 'test' && option ? column.receipts?.[option] : null;
      panel.append(previewCanvas(column, original, receipt, value => routePreview(column, value)));
      previewOverlayVisibility(panel);

      if (mode === 'overlay' && column.key !== 'original' && column.markers?.length) {
        const changes = element('div', 'preview-list');
        for (const marker of column.markers) {
          const button = previewButton('', null, () => focusPreviewMarker(column, marker), 'proposal-step');
          button.dataset.previewMarker = marker.key;
          button.append(element('span', 'proposal-step-label', marker.label));
          if (marker.detail) button.append(element('span', 'proposal-step-detail', marker.detail));
          changes.append(button);
        }
        panel.append(changes);
      }
      if (mode === 'test') {
        const order = element('div', 'preview-order');
        const path = route ? (route === 'continue' ? '선택 없이 진행' : choiceNames[route]) : '기본 선택';
        const total = element('strong', '', money(column[(option || column.defaultOption) + 'Total']));
        total.id = 'shipping-preview-total';
        order.append(element('p', '', path + ' · 주문 합계'), total);
        panel.append(order);
        const routes = element('div', 'preview-routes');
        if (receipt) {
          routes.append(previewButton('배송 선택으로 돌아가기', 'shipping-preview-back', () => {
            shippingPreview.route = null;
            redrawShippingPreview('.preview-routes [data-preview-route="continue"]');
          }));
        } else {
          for (const [key, label] of [['basic', '일반배송 선택'], ['fast', '빠른배송 선택'], ['continue', '선택 없이 진행']]) {
            const button = previewButton(label, null, () => routePreview(column, key));
            button.dataset.previewRoute = key;
            button.disabled ||= !column.receipts?.[key === 'continue' ? column.defaultOption : key];
            routes.append(button);
          }
        }
        panel.append(routes);
      }
      if (column.key !== 'original') {
        const adopted = adoptedShipping.get(column.key);
        const actions = element('div', 'shipping-actions');
        if (adopted) {
          actions.append(previewButton('채택한 안 보기', 'shipping-adopt-focus', () =>
            send({ type: 'shipping-adopt-focus', key: column.key }), 'shipping-action primary'));
          const status = element('p', 'preview-adopted', adopted.name + ' · 편집 가능');
          status.setAttribute('role', 'status');
          panel.append(status);
        } else {
          actions.append(previewButton('이 안 채택', 'shipping-adopt', () => {
            Object.assign(shippingPreview, { busy: true, action: 'adopt', error: '' });
            renderComparisons();
            send({ type: 'shipping-adopt', key: column.key });
          }, 'shipping-action primary'));
        }
        panel.append(actions);
      }
      return panel;
    }

    function shippingPreviewReply(message) {
      if (!inspectedRoot || message.rootId !== inspectedRoot) return;
      let focusSelector;
      switch (message.type) {
        case 'shipping-preview-loading':
          shippingPreview.busy = true;
          shippingPreview.open = true;
          break;
        case 'shipping-preview-result':
          shippingPreview.busy = false;
          shippingPreview.data = message.preview;
          shippingPreview.error = '';
          if (message.preview?.adopted?.key) adoptedShipping.set(message.preview.adopted.key, message.preview.adopted);
          announcement.textContent = '배송 화면 미리보기를 불러왔습니다.';
          focusSelector = '#shipping-preview-overlay';
          break;
        case 'shipping-adopted':
          shippingPreview.busy = false;
          shippingPreview.error = '';
          if (message.adopted?.key) adoptedShipping.set(message.adopted.key, message.adopted);
          announcement.textContent = '편집 가능한 배송 채택안을 만들었습니다.';
          focusSelector = '#shipping-adopt-focus';
          break;
        case 'shipping-preview-error':
          shippingPreview.busy = false;
          shippingPreview.error = message.message || '배송 미리보기를 불러올 수 없습니다.';
          break;
        case 'shipping-preview-invalidated':
          shippingPreview = newShippingPreview();
          break;
      }
      renderComparisons();
      if (focusSelector) shippingHost?.querySelector(focusSelector)?.focus({ preventScroll: true });
    }

    function requestProposal(kind, operation, button) {
      if (comparisonBusy()) return;
      const state = proposalStates.get(kind);
      state.busy = true;
      state.error = '';
      button.disabled = true;
      showControls(true, true);
      send({ type: 'proposal-' + operation, kind });
    }

    function proposalRow(kind, column) {
      const row = element('article', 'proposal-row');
      row.dataset.proposalKind = kind;
      row.dataset.proposalKey = column.key;
      row.dataset.status = Object.hasOwn(statuses, column.status) ? column.status : 'needs_context';
      const name = variantNames[column.key];
      const title = element('h3', 'proposal-row-title');
      const focusFrame = panelButton(name, 'shipping-link', () =>
        send({ type: 'proposal-focus', kind, key: column.key }));
      focusFrame.disabled = comparisonBusy() || !column.frameId;
      focusFrame.setAttribute('aria-label', name + ' 프레임 보기');
      title.append(focusFrame, element('span', 'proposal-status', statuses[row.dataset.status].label));
      row.append(title);
      if (column.summary) row.append(element('p', 'proposal-summary', column.summary));
      if (!column.steps?.length) {
        if (!column.summary) row.append(element('p', 'proposal-summary', proposalKinds[kind].empty));
        return row;
      }
      const steps = element(kind === 'price' ? 'ol' : 'ul', 'proposal-steps');
      for (const step of column.steps) {
        const li = element('li');
        const button = panelButton('', 'proposal-step', () =>
          send({ type: 'proposal-focus', kind, key: column.key, step: step.key }));
        button.dataset.proposalStep = step.key;
        button.disabled = comparisonBusy() || !step.frameId;
        button.append(element('span', 'proposal-step-label', step.label));
        if (step.detail) button.append(element('span', 'proposal-step-detail', step.detail));
        li.append(button);
        steps.append(li);
      }
      row.append(steps);
      return row;
    }

    function renderProposals() {
      if (!proposalHost) return;
      proposalHost.replaceChildren();
      proposalHost.hidden = true;
      for (const [kind, labels] of Object.entries(proposalKinds)) {
        const state = proposalStates.get(kind);
        if (!state || !(state.offer?.available || state.comparison || state.error)) continue;
        proposalHost.hidden = false;
        const card = element('section', 'proposal');
        card.id = kind + '-proposal';
        const heading = element('h2', '', state.comparison ? labels.comparison : labels.title);
        heading.id = kind + '-proposal-title';
        card.setAttribute('aria-labelledby', heading.id);
        card.append(heading);
        if (state.comparison) {
          const thumbnails = designThumbnails(state.comparison.thumbnails, key => send({ type: 'proposal-focus', kind, key }));
          if (thumbnails) card.append(thumbnails);
          for (const column of state.comparison.columns) {
            if (Object.hasOwn(variantNames, column.key)) card.append(proposalRow(kind, column));
          }
          const overview = panelButton('캔버스에서 나란히 보기', 'shipping-action secondary', () =>
            send({ type: 'proposal-overview', kind }));
          overview.id = kind + '-overview';
          overview.title = '생성 시점의 원본 사본과 두 수정안 보기';
          overview.disabled = comparisonBusy();
          const rescan = panelButton('수정안 재검사', 'shipping-action secondary', () =>
            requestProposal(kind, 'rescan', rescan));
          rescan.id = kind + '-rescan';
          rescan.disabled = comparisonBusy();
          const actions = element('div', 'shipping-actions');
          actions.append(overview, rescan);
          card.append(actions);
        } else if (state.offer?.available) {
          const create = panelButton(labels.create, 'shipping-action primary', () =>
            requestProposal(kind, 'create', create));
          create.id = kind + '-create';
          create.disabled = comparisonBusy();
          card.append(create);
        }
        if (state.busy || state.error) {
          const text = state.error || (state.comparison ? '수정안을 다시 검사하고 있습니다.' : '수정안을 만들고 있습니다.');
          const status = element('p', 'shipping-message', text);
          status.setAttribute('role', state.error ? 'alert' : 'status');
          card.append(status);
        }
        proposalHost.append(card);
      }
    }

    function renderComparisons() {
      renderShipping();
      renderProposals();
      if (advancedTools) {
        const hasDesign = comparison || shippingError || [...proposalStates.values()].some(state => state.comparison || state.error);
        advancedTools.hidden = (shippingHost.hidden && proposalHost.hidden) || !(hasDesign || comparisonBusy());
        if (comparisonBusy()) advancedTools.open = true;
        showControls(true, comparisonBusy());
      }
    }

    function proposalReply(message) {
      const { kind, type } = message;
      const replyRoot = message.rootId || message.comparison?.rootId;
      if (!Object.hasOwn(proposalKinds, kind) || !inspectedRoot || replyRoot !== inspectedRoot) return;
      const state = proposalStates.get(kind);
      if (!state) return;
      state.busy = type === 'proposal-loading';
      state.error = type === 'proposal-error' ? message.message || '수정안을 열 수 없습니다.' : '';
      if (type === 'proposal-comparison') {
        state.comparison = message.comparison;
        announcement.textContent = proposalKinds[kind].comparison + ' 결과를 표시했습니다.';
      }
      renderComparisons();
    }

    function designThumbnails(images, focus) {
      const grid = element('div', 'design-thumbnails');
      let count = 0;
      for (const key of ['minimal', 'layout']) {
        const frame = images?.[key];
        if (!frame?.png || !/^[A-Za-z0-9+/]+={0,2}$/.test(frame.png)) continue;
        const button = panelButton('', 'design-thumb', () => focus(key));
        const image = element('img');
        image.src = 'data:image/png;base64,' + frame.png;
        image.alt = variantNames[key] + ' Figma 화면';
        image.loading = 'lazy';
        button.append(image, element('span', '', variantNames[key] + ' 열기'));
        grid.append(button);
        count++;
      }
      return count ? grid : null;
    }

    function reviewRule(rule) {
      const block = element('section', 'review-rule');
      const header = element('header');
      header.append(element('span', 'review-citation', rule.citation),
        panelButton('조문 보기 ↗', 'shipping-link', () => send({ type: 'review-law' })));
      block.append(header, element('p', '', rule.criterion), element('p', '', rule.connection));
      return block;
    }

    function copyDiff(before, after) {
      const diff = element('div', 'copy-diff');
      for (const [label, text] of [['현재 문구', before], ['바꿀 문구', after]]) {
        const value = element('div', 'copy-value');
        value.append(element('span', 'mini-heading', label), element('strong', '', text));
        diff.append(value);
      }
      return diff;
    }

    function reviewAlternative(alternative, index) {
      const card = element('article', 'review-alternative');
      card.dataset.kind = alternative.kind;
      if (alternative.kind === 'copy') {
        card.append(element('h4', '', alternative.title));
        for (const change of alternative.changes || [alternative]) {
          if (change.label) card.append(element('span', 'mini-heading', change.label));
          card.append(copyDiff(change.before, change.after));
        }
      } else {
        const sketch = element('div', 'review-sketch');
        if (alternative.visual === 'checkbox') {
          sketch.className += ' checked';
          if (index > 0) sketch.append(element('span', 'sketch-option default', '기본 옵션'));
          sketch.append(element('span', 'sketch-option', alternative.detail || '추가 유료 옵션'));
          if (index === 0) sketch.append(element('span', '', alternative.after));
        } else if (alternative.visual === 'buttons') {
          sketch.className += ' buttons';
          const labels = index > 0 ? alternative.after.split(' / ', 2) : ['강조된 선택지', alternative.detail || '기본 선택지'];
          for (const label of labels) sketch.append(element('span', 'sketch-button', label));
        } else if (alternative.visual === 'price') {
          sketch.className += ' price';
          sketch.append(element('strong', '', alternative.after), element('span', '', alternative.detail));
        }
        card.append(sketch, element('h4', '', alternative.title));
      }
      card.append(element('p', '', alternative.description));
      return card;
    }

    const designKinds = { paid_option_preselection: 'shipping', misleading_visual_hierarchy: 'hierarchy', drip_pricing: 'price' };

    function reviewSolutions(finding) {
      const alternatives = finding.review.alternatives.slice(0, 3);
      const solution = element('section', 'review-solutions');
      const design = alternatives.some(alternative => alternative.kind === 'design');
      const grid = element('div', 'review-grid' + (alternatives.length === 1 ? ' single' : ''));
      solution.append(element('h3', '', design ? '화면을 바꾸는 방법' : '문구를 바꾸는 방법'), grid);
      alternatives.forEach((alternative, index) => grid.append(reviewAlternative(alternative, index)));
      const kind = designKinds[finding.pattern];
      const available = kind === 'shipping' ? shippingOffer : proposalStates.get(kind)?.offer?.available;
      if (design && available) {
        const button = panelButton('Figma 시안 보기', 'review-cta secondary', () => {
          if (!advancedTools) return;
          advancedTools.hidden = false;
          advancedTools.open = true;
          advancedTools.querySelector('#' + kind + '-create')?.click();
          advancedTools.querySelector(kind === 'shipping' ? '#shipping' : '#' + kind + '-proposal')
            ?.scrollIntoView?.({block: 'start'});
        });
        button.dataset.reviewDesign = kind;
        solution.append(button);
      }
      return solution;
    }

    function findingCard(finding) {
      const status = Object.hasOwn(statuses, finding.status) ? finding.status : 'needs_context';
      const pattern = Object.hasOwn(patternNames, finding.pattern) ? patternNames[finding.pattern] : finding.title;
      const card = element('details', 'finding');
      card.dataset.status = status;
      card.open = status === 'risk_signal';
      const summary = element('summary');
      summary.append(element('span', 'pattern', pattern), element('span', 'badge', statuses[status].label));
      const body = element('div', 'finding-body');
      const review = status === 'risk_signal' && finding.review;
      if (review) {
        body.append(element('h3', 'review-title', review.headline), element('p', 'reason', review.explanation));
      } else {
        body.append(element('p', 'reason', finding.reason));
        if (finding.suggestion) body.append(element('p', 'suggestion', finding.suggestion));
      }
      if (finding.evidence && finding.evidence.length) {
        const evidence = element('div', 'evidence');
        evidence.append(element('p', 'mini-heading', '근거 레이어'));
        finding.evidence.forEach(ref => {
          const name = ref.label || ('레이어 ' + ref.node_id);
          const button = element('button', 'layer');
          button.type = 'button';
          button.title = name + ' 레이어로 이동';
          button.setAttribute('aria-label', button.title);
          button.append(element('span', 'layer-text', name));
          button.addEventListener('click', () => send({ type: 'focus', state_id: ref.state_id, node_id: ref.node_id }));
          evidence.append(button);
        });
        body.append(evidence);
      }
      if (review) body.append(reviewRule(review.rule), reviewSolutions(finding));
      card.append(summary, body);
      return card;
    }

    function showResult(result) {
      if (result.rootId !== inspectedRoot) resetComparisons();
      inspectedRoot = result.rootId || null;
      const riskDesign = pattern => result.findings.some(finding => finding.status === 'risk_signal' && finding.pattern === pattern &&
        (!finding.review || finding.review.alternatives.some(alternative => alternative.kind === 'design')));
      shippingOffer = riskDesign('paid_option_preselection') ? result.shipping || null : null;
      for (const kind of Object.keys(proposalKinds)) {
        const previous = proposalStates.get(kind);
        const pattern = kind === 'hierarchy' ? 'misleading_visual_hierarchy' : 'drip_pricing';
        proposalStates.set(kind, { ...previous, offer: riskDesign(pattern) ? result.proposals?.[kind] : null });
      }
      const summary = element('section', 'summary');
      const findings = [...result.findings].sort((a, b) => (statuses[a.status]?.order ?? 1) - (statuses[b.status]?.order ?? 1));
      const risks = findings.filter(finding => finding.status === 'risk_signal');
      const unsureCount = findings.filter(finding => finding.status === 'needs_context').length;
      const clearCount = findings.filter(finding => finding.status === 'signal_absent').length;
      const summaryLine = element('div', 'summary-line');
      const frame = element('div');
      frame.append(element('p', 'eyebrow', '검사한 프레임'), element('h1', '', result.frameName));
      const clean = clearCount > 0 && !result.warnings?.length;
      const outcome = risks.length ? '고칠 부분 ' + risks.length + '개' : clean ? '문제 없음' : '추가 확인 필요';
      const riskBadge = element('p', 'risk-count', outcome);
      riskBadge.dataset.risk = String(risks.length > 0);
      summaryLine.append(frame, riskBadge);
      summary.append(summaryLine);
      if (result.canConfirmStart === true) {
        const confirmation = element('div', 'confirm-start');
        const button = element('button', '', '이 프레임을 여정 시작점으로 확인');
        button.type = 'button';
        button.addEventListener('click', () => send({ type: 'confirm-start' }));
        confirmation.append(element('p', '', '실제 첫 화면이라면 시작점을 확인하세요.'), button);
        summary.append(confirmation);
      }
      const section = element('section', 'findings');
      section.setAttribute('aria-label', '위험 신호');
      risks.forEach(finding => section.append(findingCard(finding)));
      if (!risks.length && clean) {
        const scope = unsureCount ? '확인한 ' + clearCount + '개 항목 기준입니다. 추가 확인 항목은 아래에서 볼 수 있습니다.'
          : '검사한 화면과 연결에서 확인된 위험 신호가 없습니다.';
        section.append(element('p', 'empty-result', scope));
      } else if (!risks.length && unsureCount) {
        section.append(element('p', 'empty-result', '아래 항목의 화면과 연결을 더 확인하세요.'));
      }
      if (!findings.length) section.append(element('p', 'empty-result', '판단할 수 있는 항목이 없습니다.'));
      const other = element('details', 'other-findings');
      const statusesSummary = [
        unsureCount ? '정보 부족 ' + unsureCount : '',
        clearCount ? '신호 없음 ' + clearCount : ''
      ].filter(Boolean);
      other.append(element('summary', '', '다른 검사 결과' + (statusesSummary.length ? ' · ' + statusesSummary.join(' · ') : '')));
      const otherFindings = findings.filter(finding => finding.status !== 'risk_signal');
      otherFindings.forEach(finding => other.append(findingCard(finding)));
      other.hidden = !otherFindings.length;
      other.open = !risks.length && !clean && unsureCount > 0;
      const details = element('details', 'advanced-tools');
      advancedTools = details;
      details.open = advancedOpen;
      details.addEventListener('toggle', () => {
        if (advancedTools === details) advancedOpen = details.open;
      });
      shippingHost = element('section', 'shipping');
      shippingHost.id = 'shipping';
      proposalHost = element('div');
      details.append(element('summary', '', '시안 만들기 및 비교'), shippingHost, proposalHost);
      content.replaceChildren(summary, section, details, other);
      renderComparisons();
      if (result.warnings && result.warnings.length) {
        const warnings = element('details', 'warnings');
        warnings.append(element('summary', '', '검사 범위 안내 ' + result.warnings.length + '건'));
        const list = element('ul');
        result.warnings.forEach(warning => list.append(element('li', '', warning)));
        warnings.append(list);
        content.append(warnings);
      }
      content.scrollTop = 0;
      content.setAttribute('aria-busy', 'false');
      notice.textContent = '';
      announcement.textContent = result.frameName + ' 검사 완료. 위험 신호 ' + risks.length + '건.';
    }

    scan.addEventListener('click', () => send({ type: 'scan' }));
    scanSelection.addEventListener('click', () => send({ type: 'scan-selection' }));
    window.addEventListener('message', event => {
      const message = getPluginMessage(event);
      if (!message) return;
      switch (message.type) {
        case 'selection':
          selectionKnown = true;
          selected = message.frameId ? { id: message.frameId, name: message.name || '프레임' } : null;
          if (!rescanAvailable && !controlsBusy) showSelection();
          else showControls(rescanAvailable, controlsBusy);
          break;
        case 'result': showResult(message); break;
        case 'empty': resetComparisons(); showSelection(); break;
        case 'loading': showMessage('검사 중', message.message || '프레임의 레이어와 연결을 확인하고 있습니다.', true); break;
        case 'error': showMessage('검사를 마치지 못했습니다', message.message || '시작 프레임을 선택한 뒤 다시 검사하세요.'); break;
        case 'notice': notice.textContent = message.message || ''; break;
        case 'shipping-loading':
        case 'shipping-comparison':
        case 'shipping-error': shippingReply(message); break;
        case 'shipping-preview-loading':
        case 'shipping-preview-result':
        case 'shipping-preview-error':
        case 'shipping-preview-invalidated':
        case 'shipping-adopted': shippingPreviewReply(message); break;
        case 'proposal-loading':
        case 'proposal-comparison':
        case 'proposal-error': proposalReply(message); break;
      }
    });
    showSelection();
    send({ type: 'ready' });
  </script>
</body>
</html>
