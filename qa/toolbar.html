<style>
  #qa-tools {
    flex: none;
    padding: 7px 14px;
    background: #edf3e9;
    color: #1c3528;
    border-bottom: 1px solid #c2cdbf;
    font:
      12px system-ui,
      sans-serif;
  }
  #qa-tools button,
  #qa-tools select {
    font: inherit;
    border: 1px solid #a4b7a5;
    border-radius: 4px;
    padding: 3px 5px;
    color: inherit;
    background: white;
  }
  #qa-tools textarea {
    display: block;
    width: 100%;
    height: 62px;
    font:
      10px ui-monospace,
      monospace;
  }
  #qa-status {
    margin: 4px 0;
  }
  #qa-manual {
    display: flex;
    gap: 3px;
    align-items: center;
    margin: 4px 0;
  }
</style>
<aside id="qa-tools" aria-label="Desktop QA">
  <button type="button" id="qa-run">세 여정 테스트 실행</button>
  <button type="button" id="qa-run-shipping">배송 수정안 테스트</button>
  <button type="button" id="qa-run-shipping-preview">배송 오버레이 테스트</button>
  <button type="button" id="qa-run-proposals">계층구조·가격 수정안 테스트</button>
  <span id="qa-status" role="status">준비</span>
  <details>
    <summary>개별 실행 · 검증 기록</summary>
    <div id="qa-manual">
      <button data-op="build">여정 생성</button>
      <select aria-label="테스트 여정" id="qa-journey">
        <option value="shipping">빠른배송</option>
        <option value="hierarchy">계층구조</option>
        <option value="price">가격</option>
      </select>
      <button data-op="start">시작점</button><button data-op="risk">위험</button
      ><button data-op="edit">수정</button>
      <button data-op="inspect">선택 ID</button>
    </div>
    <textarea id="qa-report" readonly aria-label="테스트 결과 JSON"></textarea>
  </details>
</aside>
